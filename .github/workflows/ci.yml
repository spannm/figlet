name: Build & Deploy

on:
    push:
        branches:
        - master
    pull_request:
        branches:
        - master
    workflow_dispatch: {}

# cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:

    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                # java is the JDK the tests run on, build-java the JDK that runs Maven
                java: ['11', '17', '21']
                build-java: ['21']
                include:
                -   os: ubuntu-latest
                    java: '25'
                    build-java: '25'
        runs-on: ${{ matrix.os }}
        # JDK 25 is a forward-compatibility canary: let it fail without failing the workflow or blocking deploy.
        continue-on-error: ${{ matrix.java == '25' }}
        steps:
        -   name: Check out repository (incl. font submodules)
            uses: actions/checkout@v7
            with:
                submodules: recursive
                fetch-depth: 1

        -   name: Verify font submodules were checked out
            shell: bash
            run: |
                set -euo pipefail
                for module in figlet-fonts-xero; do
                    dir="$module/src/main/resources/fonts"
                    count=$(find "$dir" -type f \( -name '*.flf' -o -name '*.tlf' \) 2>/dev/null | wc -l)
                    echo "Found $count font file(s) in $dir"
                    if [ "$count" -eq 0 ]; then
                        echo "::error::$module has no font files. Was the git submodule checked out (submodules: recursive)?"
                        exit 1
                    fi
                done

        -   name: Set up JDK ${{ matrix.build-java }} (build) and JDK ${{ matrix.java }} (test toolchain)
            # installing matrix.java alongside build-java registers both in ~/.m2/toolchains.xml; the
            # last version listed becomes JAVA_HOME/the JDK that runs Maven itself.
            uses: actions/setup-java@v6
            with:
                java-version: |
                    ${{ matrix.java }}
                    ${{ matrix.build-java }}
                distribution: 'temurin'
                cache: maven

        # the Maven wrapper pins the Maven version instead of using whatever the runner image ships;
        # bash so that ./mvnw also works on Windows
        -   name: Build with Maven/JDK ${{ matrix.build-java }} on ${{ matrix.os }}, tests forked onto JDK ${{ matrix.java }}
            shell: bash
            run: ./mvnw --batch-mode --file pom.xml -Dtest.jdk=${{ matrix.java }} clean verify

    deploy:
        needs: build
        # skip the deploy job on forks, which lack the Sonatype credentials and
        # shouldn't deploy snapshots to the upstream repository/namespace
        if: ${{ github.repository == 'spannm/figlet' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
        -   name: Check out repository (incl. font submodules)
            uses: actions/checkout@v7
            with:
                submodules: recursive
                fetch-depth: 1

        -   name: Set up Java for deployment to Sonatype snapshot repo
            uses: actions/setup-java@v6
            with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven
                # Sonatype Central Snapshots
                # must match distributionManagement/snapshotRepository/id in pom:
                server-id: sonatype-central
                server-username-env-var: SONATYPE_CENTRAL_USERNAME
                server-password-env-var: SONATYPE_CENTRAL_PASSWORD

        -   name: Deploy to Sonatype Central snapshot repo
            run: ./mvnw --batch-mode --file pom.xml --activate-profiles fast deploy
            env:
                SONATYPE_CENTRAL_USERNAME: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
                SONATYPE_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}

