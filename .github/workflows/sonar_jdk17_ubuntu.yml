name: SonarCloud analysis with JDK 17 on Ubuntu

on:
    push:
        branches:
        - master
    pull_request:
        branches:
        - master
    workflow_dispatch: {}

# cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:

    build:
        runs-on: ubuntu-latest
        # skip the analysis job on forks, which lack the SONAR_TOKEN secret and access
        # to the spannm SonarCloud organization
        if: ${{ github.repository == 'spannm/figlet' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        steps:
        -   name: Check out repository (incl. font submodules)
            uses: actions/checkout@v7
            with:
                submodules: recursive
                # disabling shallow clone is recommended for improving relevancy of reporting
                fetch-depth: 0

        -   name: Set up JDK 17
            uses: actions/setup-java@v6
            with:
                java-version: '17'
                distribution: temurin
                cache: maven

        -   name: Cache SonarQube packages
            uses: actions/cache@v4
            with:
                path: ~/.sonar/cache
                key: ${{ runner.os }}-sonar
                restore-keys: ${{ runner.os }}-sonar

        # tests run for coverage; checkstyle, Error Prone and the invoker ITs are skipped,
        # the regular build covers them and Sonar does its own static analysis
        -   name: Build with Maven/JDK 17, analyze with SonarCloud
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            run: >
                mvn --batch-mode --file pom.xml --activate-profiles sonarcloud
                -Dcheckstyle.skip=true
                -Dcheck.skip-errorprone=true
                -Dinvoker.skip=true
                verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
